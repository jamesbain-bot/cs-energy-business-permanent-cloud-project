<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081018"><meta name="apple-mobile-web-app-capable" content="yes">
<title>CS Energy Engineer</title><link rel="manifest" href="/engineer.webmanifest">
<style>
:root{--bg:#081018;--panel:#0f1924;--line:#263749;--muted:#93a3b6;--orange:#f47a20;--green:#35c778}
*{box-sizing:border-box}body{margin:0;background:#081018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}.shell{max-width:820px;margin:auto;padding:16px}.brand,.top,.tabs,.jobhead{display:flex;align-items:center;gap:12px}.top,.jobhead{justify-content:space-between}.logo{width:48px;height:48px;border-radius:14px;background:#f47a20;display:grid;place-items:center;color:#111;font-weight:950}.card{background:#0f1924;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.muted{color:var(--muted)}button{border-radius:11px;padding:11px 13px;border:1px solid var(--line);color:#fff;background:#0b1520;font-weight:750}.primary{background:var(--orange);color:#111;border:0}.tabs{margin:18px 0}.tabs button{flex:1}.tabs button.active{background:var(--orange);color:#111}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select,.search{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#08111a;color:#fff}.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:6px 8px}.green{color:#79e6aa}.hidden{display:none!important}.kv{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:7px 0}.equipment{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;height:100px;object-fit:cover;border-radius:10px}.signature{background:#fff;border-radius:12px}.signature canvas{width:100%;height:160px;display:block;touch-action:none}
</style></head><body><div class="shell">
<div class="brand"><div class="logo">CS</div><div><strong>CS Energy</strong><div class="muted">Engineer</div></div></div>
<div id="loginCard" class="card"><h1>Engineer sign in</h1><p class="muted">Use the email CS Energy has enabled for you.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="primary" onclick="login()">Sign in</button> <button onclick="signup()">Create account</button><p id="loginMsg" class="muted"></p></div>
<div id="app" class="hidden"><div class="top"><div><h2 id="who" style="margin-bottom:2px"></h2><div class="muted">CS Energy Engineer</div></div><button onclick="logout()">Sign out</button></div>
<div class="tabs"><button id="jobsTab" class="active" onclick="showTab('jobs')">🛠 My Jobs</button><button id="systemsTab" onclick="showTab('systems')">☀ Systems & Installations</button></div>
<div id="jobsView"><div id="jobs"></div></div>
<div id="systemsView" class="hidden"><input id="systemSearch" class="search" placeholder="Search customer, location, inverter, serial, battery, air con…" oninput="renderSystems()"><div id="systems"></div></div>
<div id="detail" class="hidden"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://xhbftdpbowqpfnvsvybt.supabase.co','sb_publishable_cEsokxhFCIbvq4YUl5SoEQ_KsGSfeXt');
let current=null,photos=[],systemRows=[];
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function allowed(){const {data,error}=await sb.from('cs_energy_staff_access').select('*').eq('enabled',true).limit(1);if(error)throw error;return data?.[0]}
async function init(){const s=(await sb.auth.getSession()).data.session;if(s){try{const p=await allowed();if(!p)throw Error('This email is not enabled.');enter(p)}catch(e){loginMsg.textContent=e.message}}}
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return loginMsg.textContent=error.message;try{const p=await allowed();if(!p)throw Error('This email is not enabled.');enter(p)}catch(e){loginMsg.textContent=e.message}}
async function signup(){if(!email.value.trim()||password.value.length<8)return loginMsg.textContent='Enter your enabled email and an 8+ character password.';const {error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{account_type:'engineer'}}});loginMsg.textContent=error?error.message:'Account created. Confirm your email if requested, then sign in.'}
async function logout(){await sb.auth.signOut();location.reload()}
async function enter(p){loginCard.classList.add('hidden');app.classList.remove('hidden');who.textContent=p.staff_name||p.staff_email;await Promise.all([loadJobs(),loadSystems()])}
function showTab(t){detail.classList.add('hidden');jobsView.classList.toggle('hidden',t!=='jobs');systemsView.classList.toggle('hidden',t!=='systems');jobsTab.classList.toggle('active',t==='jobs');systemsTab.classList.toggle('active',t==='systems')}
async function loadJobs(){const {data,error}=await sb.from('cs_energy_staff_jobs').select('*').order('updated_at',{ascending:false});if(error)return jobs.innerHTML='<div class="card">'+E(error.message)+'</div>';jobs.innerHTML=data?.length?data.map(r=>{const p=r.payload||{},j=p.job||{},c=p.customer||{};return `<div class="card" onclick="openJob('${r.id}')"><div class="jobhead"><strong>${E(j.type||'Job')}</strong><span class="pill">${E(r.status)}</span></div><h3>${E(c.name||'Customer')}</h3><p>${E(j.date||'')} · ${E(c.location||'')}</p><p class="muted">${E(j.notes||'')}</p></div>`}).join(''):'<div class="card muted">No jobs assigned.</div>'}
async function loadSystems(){const {data,error}=await sb.from('cs_energy_engineer_systems').select('*').order('updated_at',{ascending:false});if(error)return systems.innerHTML='<div class="card">'+E(error.message)+'</div>';systemRows=data||[];renderSystems()}
function renderSystems(){const q=(systemSearch?.value||'').toLowerCase(),rows=systemRows.filter(r=>JSON.stringify(r.payload||{}).toLowerCase().includes(q));systems.innerHTML=rows.length?rows.map(r=>{const p=r.payload||{},c=p.customer||{};if(r.kind==='solar')return `<div class="card"><div class="jobhead"><span class="pill green">☀ Solar system</span><span class="muted">${E(p.installed||'')}</span></div><h3>${E(c.name)}</h3><p>${E(c.address||c.location||'')}</p><div class="kv"><span class="muted">PV</span><strong>${E(p.pv||0)} kWp</strong><span class="muted">Panels</span><span>${E(p.panels||'—')}</span><span class="muted">Inverter</span><span>${E(p.inverter||'—')}</span><span class="muted">Serial</span><span>${E(p.serial||'—')}</span></div>${(p.batteries||[]).map((b,i)=>`<div class="equipment"><strong>🔋 Battery ${i+1}</strong><br>${E([b.manufacturer,b.model,b.capacity].filter(Boolean).join(' · '))}<br><span class="muted">Serial: ${E(b.serial||'—')}</span></div>`).join('')}${(p.evChargers||[]).map((x,i)=>`<div class="equipment"><strong>🚗 Car charger ${i+1}</strong><br>${E([x.manufacturer,x.model,x.capacity].filter(Boolean).join(' · '))}<br><span class="muted">Serial: ${E(x.serial||'—')}</span></div>`).join('')}</div>`;return `<div class="card"><div class="jobhead"><span class="pill">${E(p.type||'Installation')}</span><span class="muted">${E(p.status||'')}</span></div><h3>${E(c.name)}</h3><p>${E(c.address||c.location||'')}</p><strong>${E([p.manufacturer,p.model].filter(Boolean).join(' ')||'Equipment')}</strong><div class="kv"><span class="muted">Serial</span><span>${E(p.serial||'—')}</span><span class="muted">Capacity</span><span>${E(p.capacity||'—')}</span><span class="muted">Location</span><span>${E(p.location||'—')}</span></div><p class="muted">${E(p.notes||'')}</p></div>`}).join(''):'<div class="card muted">No systems or installations found. In Business, press Sync systems to Engineer app.</div>'}
async function openJob(id){const {data,error}=await sb.from('cs_energy_staff_jobs').select('*').eq('id',id).single();if(error)return alert(error.message);current=data;photos=Array.isArray(data.photos)?data.photos:[];jobsView.classList.add('hidden');systemsView.classList.add('hidden');detail.classList.remove('hidden');drawJob()}
function drawJob(){const p=current.payload||{},j=p.job||{},c=p.customer||{};detail.innerHTML=`<button onclick="showTab('jobs')">← My jobs</button><div class="card"><h2>${E(j.type||'Job')}</h2><h3>${E(c.name)}</h3><p>${E(c.address||c.location||'')}<br>${E(c.phone||'')}</p><p class="muted">${E(j.notes||'')}</p></div><div class="card"><div class="field"><label>Status</label><select id="st"><option>Assigned</option><option>Booked</option><option>On Site</option><option>Parts Required</option><option>Complete</option></select></div><div class="field"><label>Work carried out</label><textarea id="work">${E(current.work_done||'')}</textarea></div><div class="field"><label>Measurements / readings</label><textarea id="readings">${E(current.readings||'')}</textarea></div><div class="field"><label>Parts used / required</label><textarea id="parts">${E(current.parts||'')}</textarea></div><h3>Site photos</h3><input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(event)"><div id="photoGrid" class="photos"></div><h3>Customer signature</h3><div class="signature"><canvas id="sig" width="700" height="250"></canvas></div><button onclick="clearSig()">Clear signature</button><p><button class="primary" onclick="saveJob()">Save job update</button></p></div>`;st.value=current.status||'Assigned';drawPhotos();setupSig(current.signature)}
function addPhotos(e){[...e.target.files].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=()=>{photos.push(r.result);drawPhotos()};r.readAsDataURL(f)});e.target.value=''}
function drawPhotos(){if(photoGrid)photoGrid.innerHTML=photos.map((p,i)=>`<div><img src="${p}"><button onclick="photos.splice(${i},1);drawPhotos()">Remove</button></div>`).join('')}
let drawing=false;function setupSig(existing){const c=sig,ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.lineCap='round';if(existing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=existing}const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(drawing){const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()}};c.onpointerup=c.onpointerleave=()=>drawing=false}
function clearSig(){setupSig(null)}
async function saveJob(){const row={status:st.value,work_done:work.value.trim(),readings:readings.value.trim(),parts:parts.value.trim(),photos,signature:sig.toDataURL('image/png'),updated_at:new Date().toISOString()};const {error}=await sb.from('cs_energy_staff_jobs').update(row).eq('id',current.id);if(error)return alert(error.message);alert('Job update saved.');showTab('jobs');loadJobs()}
init();
</script></body></html>
