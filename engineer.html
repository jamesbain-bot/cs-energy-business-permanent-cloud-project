<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081018"><meta name="apple-mobile-web-app-capable" content="yes"><title>CS Energy Engineer</title><link rel="manifest" href="/engineer.webmanifest"><style>:root{--bg:#081018;--panel:#0f1924;--line:#263749;--muted:#93a3b6;--orange:#f47a20}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071018,#0b1420);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}.shell{max-width:760px;margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#f47a20,#ffc24a);display:grid;place-items:center;color:#111;font-weight:950}.card{background:#0f1924;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.muted{color:var(--muted)}.primary,.ghost,.mini{border-radius:11px;padding:11px 13px;border:1px solid var(--line);color:#fff;background:#0b1520;font-weight:750}.primary{background:var(--orange);color:#111;border:0}.ghost{background:transparent}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#08111a;color:#fff}.job{cursor:pointer}.jobhead{display:flex;justify-content:space-between;gap:12px}.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:6px 8px}.hidden{display:none!important}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;height:100px;object-fit:cover;border-radius:10px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.signature{background:#fff;border-radius:12px;overflow:hidden}.signature canvas{width:100%;height:160px;display:block;touch-action:none}</style></head><body><div class="shell"><div class="brand"><div class="logo">CS</div><div><strong>CS Energy</strong><div class="muted">Engineer app</div></div></div><div id="loginCard" class="card"><h1>Engineer sign in</h1><p class="muted">Use the email address CS Energy has enabled for you.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="primary" onclick="login()">Sign in</button> <button class="ghost" onclick="signup()">Create account</button><p id="loginMsg" class="muted"></p></div><div id="home" class="hidden"><div class="topbar"><div><h1 style="margin-bottom:2px">My jobs</h1><div id="who" class="muted"></div></div><button class="ghost" onclick="logout()">Sign out</button></div><div id="jobs"></div></div><div id="detail" class="hidden"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SBURL='https://xhbftdpbowqpfnvsvybt.supabase.co',SBKEY='sb_publishable_cEsokxhFCIbvq4YUl5SoEQ_KsGSfeXt',sb=supabase.createClient(SBURL,SBKEY);let session=null,current=null,photos=[];const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function permitted(){const {data,error}=await sb.from('cs_energy_staff_access').select('*').eq('enabled',true).limit(10);if(error)throw error;return data?.[0]||null}
async function init(){session=(await sb.auth.getSession()).data.session;if(session){try{const p=await permitted();if(!p)throw Error('This email is not enabled for the CS Energy Engineer app.');showHome(p)}catch(e){loginMsg.textContent=e.message}}}
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return loginMsg.textContent=error.message;session=data.session;try{const p=await permitted();if(!p)throw Error('This email is not enabled for the Engineer app.');showHome(p)}catch(e){loginMsg.textContent=e.message}}
async function signup(){const e=email.value.trim(),p=password.value;if(!e||p.length<8)return loginMsg.textContent='Enter your enabled email and a password of at least 8 characters.';const {error}=await sb.auth.signUp({email:e,password:p,options:{data:{account_type:'engineer'}}});loginMsg.textContent=error?error.message:'Account created. Check your email if confirmation is required, then sign in.'}
async function logout(){await sb.auth.signOut();location.reload()}
async function showHome(p){loginCard.classList.add('hidden');home.classList.remove('hidden');detail.classList.add('hidden');who.textContent=p.staff_name||p.staff_email;await loadJobs()}
async function loadJobs(){const {data,error}=await sb.from('cs_energy_staff_jobs').select('*').order('assigned_at',{ascending:true});if(error)return jobs.innerHTML='<div class="card">'+E(error.message)+'</div>';jobs.innerHTML=data?.length?data.map(r=>{const p=r.payload||{},j=p.job||{},c=p.customer||{};return '<div class="card job" onclick="openJob(\''+r.id+'\')"><div class="jobhead"><strong>'+E(j.type||'Job')+'</strong><span class="pill">'+E(r.status)+'</span></div><h3>'+E(c.name||'Customer')+'</h3><p>'+E(j.date||'')+' · '+E(c.location||'')+'</p><p class="muted">'+E(j.notes||'')+'</p></div>'}).join(''):'<div class="card muted">No jobs assigned.</div>'}
async function openJob(id){const {data,error}=await sb.from('cs_energy_staff_jobs').select('*').eq('id',id).single();if(error)return alert(error.message);current=data;photos=Array.isArray(data.photos)?data.photos:[];home.classList.add('hidden');detail.classList.remove('hidden');drawDetail();setupSig(data.signature)}
function drawDetail(){const p=current.payload||{},j=p.job||{},c=p.customer||{},s=p.system||{};detail.innerHTML=`<button class="ghost" onclick="home.classList.remove('hidden');detail.classList.add('hidden');loadJobs()">← My jobs</button><div class="card"><div class="jobhead"><h2>${E(j.type||'Job')}</h2><span class="pill">${E(current.status)}</span></div><p><strong>${E(c.name)}</strong><br>${E(c.address||c.location)}<br>${E(c.phone)}</p><p class="muted">${E(j.notes||'')}</p></div>${p.system?`<div class="card"><h3>System</h3><p>${E(s.inverter||'')} · ${E(s.pv||0)} kWp</p><p>${E(s.battery||'')} ${s.batteryKwh?E(s.batteryKwh)+' kWh':''}</p><p class="muted">Inverter serial: ${E(s.serial||'—')}</p></div>`:''}<div class="card"><div class="field"><label>Status</label><select id="st"><option>Assigned</option><option>Booked</option><option>On Site</option><option>Parts Required</option><option>Complete</option></select></div><div class="field"><label>Work carried out</label><textarea id="work">${E(current.work_done||'')}</textarea></div><div class="field"><label>Measurements / readings</label><textarea id="readings">${E(current.readings||'')}</textarea></div><div class="field"><label>Parts used / required</label><textarea id="parts">${E(current.parts||'')}</textarea></div><h3>Site photos</h3><input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(event)"><div id="photoGrid" class="photos"></div><h3>Customer signature</h3><div class="signature"><canvas id="sig" width="700" height="250"></canvas></div><button class="mini" style="margin-top:8px" onclick="clearSig()">Clear signature</button><div style="margin-top:16px"><button class="primary" onclick="saveJob()">Save job update</button></div></div>`;st.value=current.status||'Assigned';drawPhotos()}
function addPhotos(e){[...e.target.files].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=900,sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photos.push(c.toDataURL('image/jpeg',.62));drawPhotos()};im.src=r.result};r.readAsDataURL(f)});e.target.value=''}
function drawPhotos(){const g=document.getElementById('photoGrid');if(g)g.innerHTML=photos.map((p,i)=>'<div><img src="'+p+'"><button class="mini" onclick="photos.splice('+i+',1);drawPhotos()">Remove</button></div>').join('')}
let drawing=false;function setupSig(existing){const c=document.getElementById('sig');if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.lineCap='round';if(existing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=existing}const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=c.onpointerleave=()=>drawing=false}
function clearSig(){setupSig(null)}
async function saveJob(){const row={status:st.value,work_done:work.value.trim(),readings:readings.value.trim(),parts:parts.value.trim(),photos,signature:sig.toDataURL('image/png'),updated_at:new Date().toISOString()};const {error}=await sb.from('cs_energy_staff_jobs').update(row).eq('id',current.id);if(error)return alert(error.message);current={...current,...row};alert('Job update saved.');if(row.status==='Complete'){detail.classList.add('hidden');home.classList.remove('hidden');loadJobs()}}
init();</script></body></html>
