<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081018"><meta name="apple-mobile-web-app-capable" content="yes">
<title>CS Energy Customer</title><link rel="manifest" href="/customer.webmanifest">
<style>
:root{--bg:#081018;--panel:#0f1924;--line:#263749;--muted:#93a3b6;--orange:#f47a20;--green:#35c778}
*{box-sizing:border-box}body{margin:0;background:#081018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}.shell{max-width:900px;margin:auto;padding:16px}.brand,.top,.tabs,.between{display:flex;align-items:center;gap:12px}.top,.between{justify-content:space-between}.logo{width:48px;height:48px;border-radius:14px;background:#f47a20;display:grid;place-items:center;color:#111;font-weight:950}.card{background:#0f1924;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.muted{color:var(--muted)}button{border-radius:11px;padding:11px 13px;border:1px solid var(--line);color:#fff;background:#0b1520;font-weight:750}.primary{background:var(--orange);color:#111;border:0}.tabs{overflow:auto;margin:16px 0}.tabs button{white-space:nowrap}.tabs .active{background:var(--orange);color:#111}.hidden{display:none!important}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#08111a;color:#fff}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#0b1520;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi small{display:block;color:var(--muted);margin-bottom:5px}.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:6px 8px}.green{color:#79e6aa}.kv{display:grid;grid-template-columns:130px 1fr;gap:8px;margin:7px 0}.item{border-top:1px solid var(--line);padding:11px 0}.item:first-child{border-top:0}.monitor{height:560px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line)}.monitor iframe{width:100%;height:100%;border:0}.doc{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.doc:first-child{border-top:0}@media(max-width:650px){.kpis{grid-template-columns:1fr 1fr}.kv{grid-template-columns:105px 1fr}.monitor{height:440px}}
</style></head><body><div class="shell">
<div class="brand"><div class="logo">CS</div><div><strong>CS Energy</strong><div class="muted">Customer</div></div></div>
<div id="login" class="card"><h1>Your CS Energy system</h1><p class="muted">Sign in with the email address registered on your CS Energy customer account.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="primary" onclick="signIn()">Sign in</button> <button onclick="signUp()">Create account</button><p id="msg" class="muted"></p></div>
<div id="app" class="hidden"><div class="top"><div><h2 id="hello"></h2><div class="muted">Your CS Energy account</div></div><button onclick="signOut()">Sign out</button></div>
<div class="tabs"><button id="tHome" class="active" onclick="tab('home')">Home</button><button id="tSystem" onclick="tab('system')">My System</button><button id="tMonitor" onclick="tab('monitor')">Live Monitoring</button><button id="tService" onclick="tab('service')">Service</button><button id="tDocs" onclick="tab('docs')">Documents</button></div>
<div id="home"></div><div id="system" class="hidden"></div><div id="monitor" class="hidden"></div><div id="service" class="hidden"></div><div id="docs" class="hidden"></div>
</div></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient('https://xhbftdpbowqpfnvsvybt.supabase.co','sb_publishable_cEsokxhFCIbvq4YUl5SoEQ_KsGSfeXt');
let rec=null,access=null,me=null,docsRows=[],requestRows=[];
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const date=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB'):'—';
async function allowed(){const {data,error}=await sb.from('customer_portal_access').select('*').eq('enabled',true).limit(1);if(error)throw error;return data?.[0]}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session){me=session.user;try{access=await allowed();if(!access)throw Error('Customer app access is not enabled for this email.');await load()}catch(e){msg.textContent=e.message}}}
async function signIn(){const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return msg.textContent=error.message;me=data.user;try{access=await allowed();if(!access)throw Error('Customer app access is not enabled for this email.');await load()}catch(e){msg.textContent=e.message}}
async function signUp(){if(!email.value.trim()||password.value.length<8)return msg.textContent='Enter your registered email and an 8+ character password.';const {error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{account_type:'customer'}}});msg.textContent=error?error.message:'Account created. Confirm your email if requested, then sign in.'}
async function signOut(){await sb.auth.signOut();location.reload()}
async function load(){const {data,error}=await sb.from('customer_portal_snapshots').select('*').limit(1).maybeSingle();if(error)throw error;if(!data)throw Error('No customer record is linked to this account yet.');rec=data;const p=rec.payload||{},c=p.customer||{};login.classList.add('hidden');app.classList.remove('hidden');hello.textContent='Hello '+((c.name||'').split(' ')[0]||'there');await Promise.all([loadDocs(),loadRequests()]);renderAll()}
function tab(x){['home','system','monitor','service','docs'].forEach(k=>{document.getElementById(k).classList.toggle('hidden',k!==x);document.getElementById('t'+k[0].toUpperCase()+k.slice(1)).classList.toggle('active',k===x)})}
function systems(){const p=rec?.payload||{};if(Array.isArray(p.systems))return p.systems;if(p.system)return[p.system];return []}
function solarUrl(s){return [s.solarWebUrl,s.publicDisplayUrl,s.monitorUrl,s.monitoringUrl].find(v=>typeof v==='string'&&/solarweb\.com/i.test(v))||''}
function renderAll(){const p=rec.payload||{},c=p.customer||{},ss=systems(),s=ss[0]||{},jobs=p.jobs||[];
home.innerHTML=`<div class="kpis"><div class="kpi"><small>System</small><strong>${E(s.inverter||'Installed')}</strong></div><div class="kpi"><small>Solar array</small><strong>${s.pv?E(s.pv)+' kWp':'—'}</strong></div><div class="kpi"><small>Battery</small><strong>${s.batteryKwh?E(s.batteryKwh)+' kWh':'—'}</strong></div><div class="kpi"><small>Care plan</small><strong>${E(c.plan||access.plan||'No plan')}</strong></div></div><div class="card"><h3>Next service</h3><p>${E(date(c.nextService))}</p><button class="primary" onclick="tab('service')">Book / request service</button></div><div class="card"><h3>Your system</h3><p>${E(s.inverter||'System recorded')}</p><button onclick="tab('system')">View equipment</button> ${ss.some(x=>solarUrl(x))?'<button onclick="tab(\\'monitor\\')">Live monitoring</button>':''}</div>`;
system.innerHTML=`<div class="card"><h2>My system</h2>${ss.length?ss.map((x,i)=>`<div class="item"><div class="between"><strong>☀ ${E(x.inverter||'Solar system')}</strong><span class="pill green">${E(x.installed?date(x.installed):'Installed')}</span></div><div class="kv"><span class="muted">PV</span><span>${x.pv?E(x.pv)+' kWp':'—'}</span><span class="muted">Panels</span><span>${E(x.panels||'—')}</span><span class="muted">Inverter serial</span><span>${E(x.serial||'—')}</span><span class="muted">Battery</span><span>${E(x.battery||'—')} ${x.batteryKwh?'· '+E(x.batteryKwh)+' kWh':''}</span></div>${(x.batteries||[]).map((b,n)=>`<p class="muted">🔋 Battery ${n+1}: ${E([b.manufacturer,b.model].filter(Boolean).join(' '))} · Serial ${E(b.serial||'—')}</p>`).join('')}${(x.evChargers||[]).map((z,n)=>`<p class="muted">🚗 Charger ${n+1}: ${E([z.manufacturer,z.model].filter(Boolean).join(' '))} · Serial ${E(z.serial||'—')}</p>`).join('')}</div>`).join(''):'<p>No system is recorded yet.</p>'}</div>`;
const mons=ss.filter(x=>solarUrl(x));monitor.innerHTML=`<div class="card"><h2>Live monitoring</h2>${mons.length?mons.map(x=>`<div class="item"><div class="between"><strong>${E(x.inverter||'Fronius Solar.web')}</strong><button onclick="window.open('${E(solarUrl(x))}','_blank','noopener')">Open Solar.web</button></div><div class="monitor"><iframe src="${E(solarUrl(x))}" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></div>`).join(''):'<p class="muted">Live monitoring has not been linked to your customer app yet.</p>'}</div>`;
service.innerHTML=`<div class="card"><h2>Care plan & service</h2><div class="kv"><span class="muted">Care plan</span><strong>${E(c.plan||access.plan||'No plan')}</strong><span class="muted">Next service</span><span>${E(date(c.nextService))}</span></div></div><div class="card"><h3>Request a visit</h3><div class="field"><label>Service type</label><select id="rtype"><option>Service call</option><option>Annual service</option><option>System fault</option><option>Battery / inverter issue</option><option>Other</option></select></div><div class="field"><label>Preferred date</label><input id="rdate" type="date"></div><div class="field"><label>What do you need help with?</label><textarea id="rdesc"></textarea></div><button class="primary" onclick="sendRequest()">Send request</button></div><div class="card"><h3>Service history</h3>${jobs.length?jobs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(j=>`<div class="doc"><span>${E(date(j.date))} · ${E(j.type||'Service')}</span><span class="pill">${E(j.status||'')}</span></div>`).join(''):'<p class="muted">No service history yet.</p>'}<h3>Your requests</h3><div id="requestsHost"></div></div>`;renderRequests();
docs.innerHTML=`<div class="card"><h2>Documents</h2>${docsRows.length?docsRows.map(d=>`<div class="doc"><div><strong>${E(d.document_type||'Document')}</strong><br><span class="muted">${E(d.file_name||'')}</span></div><span class="pill">${E(date((d.created_at||'').slice(0,10)))}</span></div>`).join(''):'<p class="muted">No documents have been shared with your account yet.</p>'}</div>`}
async function loadDocs(){const {data}=await sb.from('customer_documents').select('id,document_type,file_name,mime_type,file_size,notes,created_at').eq('customer_id',access.customer_id).order('created_at',{ascending:false});docsRows=data||[]}
async function loadRequests(){const {data}=await sb.from('customer_service_requests').select('*').eq('customer_id',access.customer_id).order('created_at',{ascending:false});requestRows=data||[]}
function renderRequests(){const h=document.getElementById('requestsHost');if(h)h.innerHTML=requestRows.length?requestRows.map(r=>`<div class="doc"><span>${E(date((r.created_at||'').slice(0,10)))} · ${E(r.request_type)}</span><span class="pill">${E(r.status)}</span></div>`).join(''):'<p class="muted">No open requests.</p>'}
async function sendRequest(){if(!rdate.value)return alert('Choose a preferred date.');const row={owner_user_id:access.owner_user_id,customer_id:access.customer_id,customer_email:access.customer_email,customer_user_id:me.id,request_type:rtype.value,preferred_date:rdate.value,description:rdesc.value.trim(),status:'Requested'};const {error}=await sb.from('customer_service_requests').insert(row);if(error)return alert(error.message);rdesc.value='';await loadRequests();renderRequests();alert('Service request sent to CS Energy.')}
Object.assign(window,{signIn,signUp,signOut,tab,sendRequest});
boot();
</script></body></html>
